<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Produk - REDLINE Admin</title>
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/typography.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/admin/layout.css" />
</head>
<body>
  <div class="admin-menu-overlay" id="admin-menu-overlay"></div>
  <aside class="admin-sidebar" id="admin-sidebar">
    <div class="admin-sidebar__header">
      <div class="admin-sidebar__logo-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
      </div>
      <a href="/admin/index.html" class="admin-sidebar__logo-text">REDLINE</a>
    </div>

    <nav class="admin-nav">
      <div class="admin-nav__label">Menu Utama</div>
      <a href="/admin/index.html" class="admin-nav__link">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        Dashboard
      </a>
      <a href="/admin/products.html" class="admin-nav__link active">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
        Produk
      </a>
      
      <div class="admin-nav__label">Penjualan</div>
      <a href="/admin/orders.html" class="admin-nav__link">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        Pesanan
      </a>
      <a href="/admin/leads.html" class="admin-nav__link">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        Leads
      </a>

      <div class="admin-nav__label">Sistem</div>
      <a href="/admin/content.html" class="admin-nav__link">
        <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
        Konten & Promo
      </a>
      <a href="/admin/profile.html" class="admin-nav__link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        Profil Admin
      </a>
      
      <a href="#" id="logout-btn" class="admin-nav__link" style="margin-top: auto; color: #EF4444;">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        Logout
      </a>
    </nav>
    
    <div class="admin-sidebar__footer">
      <div class="theme-toggle">
        <button class="active">Light</button>
        <button>Dark</button>
      </div>
    </div>
  </aside>

  <main class="admin-main">
    <header class="admin-header">
      <div class="admin-header__left">
        <button class="admin-menu-toggle" id="admin-menu-toggle">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <div class="admin-header__greeting">
          <strong>Products</strong>
        </div>
      </div>
      
      <div class="admin-header__right">
        <button class="btn btn--primary" id="add-product-btn">Add Product</button>
        <div class="admin-search hide-mobile">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" placeholder="Search products..." />
        </div>
        <img src="https://ui-avatars.com/api/?name=Admin&background=E5E7EB&color=374151" alt="Avatar" class="admin-avatar" id="header-avatar" />
      </div>
    </header>

    <div class="admin-content">
      <div class="admin-card">
        <div class="admin-card-header">
          <div class="admin-card-title">Daftar Produk</div>
        </div>
        <div style="overflow-x: auto;">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Gambar</th>
                <th>Nama Produk</th>
                <th>Harga</th>
                <th>Kategori & Stok</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="products-list">
              <tr><td colspan="5" style="text-align: center; padding: 24px;">Memuat produk...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Add Product Modal -->
    <div id="product-modal" class="modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999; align-items: center; justify-content: center; padding: 20px;">
      <div class="modal-content" style="background: var(--color-bg); width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; border-radius: 8px; padding: 24px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
          <h2 style="font-size: 1.25rem; margin: 0;">Tambah Produk Baru</h2>
          <button id="close-modal-btn" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--color-text-secondary);">&times;</button>
        </div>
        <form id="product-form" style="display: flex; flex-direction: column; gap: 16px;">
          <div>
            <label style="display: block; margin-bottom: 4px; font-weight: 500;">Nama Produk</label>
            <input type="text" id="prod-name" class="input" style="width: 100%;" required>
          </div>
          <div>
            <label style="display: block; margin-bottom: 4px; font-weight: 500;">Slug</label>
            <input type="text" id="prod-slug" class="input" style="width: 100%;" required>
          </div>
          <div style="display: flex; gap: 16px;">
            <div style="flex: 1;">
              <label style="display: block; margin-bottom: 4px; font-weight: 500;">Harga (Rp)</label>
              <input type="number" id="prod-price" class="input" style="width: 100%;" required>
            </div>
            <div style="flex: 1;">
              <label style="display: block; margin-bottom: 4px; font-weight: 500;">Harga Coret / Sale (Opsional)</label>
              <input type="number" id="prod-sale" class="input" style="width: 100%;">
            </div>
          </div>
          <div>
            <label style="display: block; margin-bottom: 4px; font-weight: 500;">Kategori ID</label>
            <select id="prod-category" class="input" style="width: 100%;" required>
              <option value="">Memuat kategori...</option>
            </select>
          </div>
          <div>
            <label style="display: block; margin-bottom: 4px; font-weight: 500;">Deskripsi Produk</label>
            <textarea id="prod-desc" class="input" style="width: 100%; min-height: 100px; resize: vertical;" required></textarea>
          </div>
          <div>
            <label style="display: block; margin-bottom: 4px; font-weight: 500;">Badge (Opsional)</label>
            <input type="text" id="prod-badge" class="input" style="width: 100%;" placeholder="e.g. Terlaris, Baru, Sale">
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
              <label style="display: block; margin-bottom: 4px; font-weight: 500;">Gambar Utama (Wajib)</label>
              <input type="file" id="upload-img-main" accept="image/*" class="input" style="width: 100%; padding: 8px;">
              <input type="hidden" id="prod-img-main">
              <img id="preview-img-main" style="width: 100%; height: 120px; object-fit: contain; background: var(--color-surface); margin-top: 8px; border-radius: 4px; display: none;" />
            </div>
            <div class="form-group">
              <label style="display: block; margin-bottom: 4px; font-weight: 500;">Gambar Depan (Opsional)</label>
              <input type="file" id="upload-img-front" accept="image/*" class="input" style="width: 100%; padding: 8px;">
              <input type="hidden" id="prod-img-front">
              <img id="preview-img-front" style="width: 100%; height: 120px; object-fit: contain; background: var(--color-surface); margin-top: 8px; border-radius: 4px; display: none;" />
            </div>
            <div class="form-group">
              <label style="display: block; margin-bottom: 4px; font-weight: 500;">Gambar Belakang (Opsional)</label>
              <input type="file" id="upload-img-back" accept="image/*" class="input" style="width: 100%; padding: 8px;">
              <input type="hidden" id="prod-img-back">
              <img id="preview-img-back" style="width: 100%; height: 120px; object-fit: contain; background: var(--color-surface); margin-top: 8px; border-radius: 4px; display: none;" />
            </div>
            <div class="form-group">
              <label style="display: block; margin-bottom: 4px; font-weight: 500;">Gambar Detail/Lainnya (Opsional)</label>
              <input type="file" id="upload-img-detail" accept="image/*" class="input" style="width: 100%; padding: 8px;">
              <input type="hidden" id="prod-img-detail">
              <img id="preview-img-detail" style="width: 100%; height: 120px; object-fit: contain; background: var(--color-surface); margin-top: 8px; border-radius: 4px; display: none;" />
            </div>
            <div class="form-group">
              <label style="display: block; margin-bottom: 4px; font-weight: 500;">Gambar Tambahan 1 (Opsional)</label>
              <input type="file" id="upload-img-opt1" accept="image/*" class="input" style="width: 100%; padding: 8px;">
              <input type="hidden" id="prod-img-opt1">
              <img id="preview-img-opt1" style="width: 100%; height: 120px; object-fit: contain; background: var(--color-surface); margin-top: 8px; border-radius: 4px; display: none;" />
            </div>
            <div class="form-group">
              <label style="display: block; margin-bottom: 4px; font-weight: 500;">Gambar Tambahan 2 (Opsional)</label>
              <input type="file" id="upload-img-opt2" accept="image/*" class="input" style="width: 100%; padding: 8px;">
              <input type="hidden" id="prod-img-opt2">
              <img id="preview-img-opt2" style="width: 100%; height: 120px; object-fit: contain; background: var(--color-surface); margin-top: 8px; border-radius: 4px; display: none;" />
            </div>
            <div class="form-group">
              <label style="display: block; margin-bottom: 4px; font-weight: 500;">Gambar Tambahan 3 (Opsional)</label>
              <input type="file" id="upload-img-opt3" accept="image/*" class="input" style="width: 100%; padding: 8px;">
              <input type="hidden" id="prod-img-opt3">
              <img id="preview-img-opt3" style="width: 100%; height: 120px; object-fit: contain; background: var(--color-surface); margin-top: 8px; border-radius: 4px; display: none;" />
            </div>
          </div>
          <button type="submit" class="btn btn--primary" style="margin-top: 16px;">Simpan Produk</button>
        </form>
      </div>
    </div>
  </main>

  <script type="module" src="../js/admin/products.js"></script>
</body>
</html>
