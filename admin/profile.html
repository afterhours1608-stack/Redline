<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Profil Admin - REDLINE</title>
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/typography.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/admin/layout.css" />
  <style>
    .profile-form {
      max-width: 600px;
    }
    .profile-avatar-preview {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #E5E7EB;
      margin-bottom: 1rem;
    }
    .profile-form .form-group {
      margin-bottom: 16px;
    }
    .profile-form .form-label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--admin-text-main);
    }
    .profile-form .input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--admin-border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      background: var(--color-bg, #fff);
      color: var(--admin-text-main);
      transition: border-color 0.2s;
    }
    .profile-form .input:focus {
      border-color: var(--admin-primary);
    }
    .profile-form .input:disabled {
      background: #F3F4F6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="admin-menu-overlay" id="admin-menu-overlay"></div>
  
  <aside class="admin-sidebar" id="admin-sidebar">
    <div class="admin-sidebar__header">
      <div class="admin-sidebar__logo-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
        </svg>
      </div>
      <a href="/admin/index.html" class="admin-sidebar__logo-text">REDLINE</a>
    </div>

    <nav class="admin-nav">
      <div class="admin-nav__label">Menu Utama</div>
      <a href="/admin/index.html" class="admin-nav__link">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        Dashboard
      </a>
      <a href="/admin/products.html" class="admin-nav__link">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
        Produk
      </a>
      
      <div class="admin-nav__label">Penjualan</div>
      <a href="/admin/orders.html" class="admin-nav__link">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        Pesanan
      </a>
      <a href="/admin/leads.html" class="admin-nav__link">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        Leads
      </a>

      <div class="admin-nav__label">Sistem</div>
      <a href="/admin/content.html" class="admin-nav__link">
        <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
        Konten &amp; Promo
      </a>
      <a href="/admin/payments.html" class="admin-nav__link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2" ry="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
        Pembayaran
      </a>
      <a href="/admin/profile.html" class="admin-nav__link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        Profil Admin
      </a>
      
      <a href="#" id="logout-btn" class="admin-nav__link" style="margin-top: auto; color: #EF4444;">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        Logout
      </a>
    </nav>

    <div class="admin-sidebar__footer">
      <div class="theme-toggle">
        <button class="active">Light</button>
        <button>Dark</button>
      </div>
    </div>
  </aside>

  <main class="admin-main">
    <header class="admin-header">
      <div class="admin-header__left">
        <button class="admin-menu-toggle" id="admin-menu-toggle">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <div class="admin-header__greeting">
          <strong>Pengaturan Profil</strong>
        </div>
      </div>
      
      <div class="admin-header__right">
        <img src="https://ui-avatars.com/api/?name=Admin&background=E5E7EB&color=374151" alt="Avatar" class="admin-avatar" id="header-avatar" />
      </div>
    </header>

    <div class="admin-content">
      <div class="admin-card">
        <div class="admin-card-header">
          <div class="admin-card-title">Informasi Pribadi</div>
        </div>
        <div class="admin-card-body">
          <form id="profile-form" class="profile-form">
            <div class="form-group" style="margin-bottom: 24px;">
              <label class="form-label">Foto Profil</label>
              <div style="display: flex; align-items: center; gap: 16px;">
                <img id="avatar-preview" src="https://ui-avatars.com/api/?name=Admin&background=E5E7EB&color=374151" class="profile-avatar-preview" />
                <div>
                  <input type="file" id="avatar-upload" accept="image/*" style="display: none;" />
                  <button type="button" class="btn btn--outline" onclick="document.getElementById('avatar-upload').click()">Ganti Foto</button>
                  <p style="font-size: 0.8rem; color: #6B7280; margin-top: 8px;">Direkomendasikan rasio 1:1. Maksimal 2MB.</p>
                </div>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Nama Lengkap (Username)</label>
              <input type="text" id="profile-name" class="input" placeholder="Masukkan nama" required />
            </div>

            <div class="form-group">
              <label class="form-label">Alamat Email</label>
              <input type="email" id="profile-email" class="input" disabled />
              <p style="font-size: 0.8rem; color: #6B7280; margin-top: 4px;">Email tidak dapat diubah (digunakan untuk login).</p>
            </div>

            <div class="form-group" style="margin-bottom: 32px;">
              <label class="form-label">Password Baru (Opsional)</label>
              <input type="password" id="profile-password" class="input" placeholder="Biarkan kosong jika tidak ingin mengubah password" />
            </div>

            <div style="display: flex; gap: 12px;">
              <button type="submit" class="btn btn--primary" id="btn-save-profile">Simpan Perubahan</button>
            </div>
            <div id="profile-message" style="margin-top: 16px; font-weight: 500;"></div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="../js/admin/profile.js"></script>
</body>
</html>
