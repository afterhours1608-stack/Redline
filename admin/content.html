<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Konten & Promo - REDLINE Admin</title>
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/typography.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/admin/layout.css" />
  <!-- Removed inline form-section style as we now use admin-card from layout.css -->
</head>
<body>
  <div class="admin-menu-overlay" id="admin-menu-overlay"></div>
  <aside class="admin-sidebar" id="admin-sidebar">
    <div class="admin-sidebar__header">
      <div class="admin-sidebar__logo-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
      </div>
      <a href="/admin/index.html" class="admin-sidebar__logo-text">REDLINE</a>
    </div>

    <nav class="admin-nav">
      <div class="admin-nav__label">Menu Utama</div>
      <a href="/admin/index.html" class="admin-nav__link">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        Dashboard
      </a>
      <a href="/admin/products.html" class="admin-nav__link">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
        Produk
      </a>
      
      <div class="admin-nav__label">Penjualan</div>
      <a href="/admin/orders.html" class="admin-nav__link">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        Pesanan
      </a>
      <a href="/admin/leads.html" class="admin-nav__link">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        Leads
      </a>

      <div class="admin-nav__label">Sistem</div>
      <a href="/admin/content.html" class="admin-nav__link active">
        <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
        Konten & Promo
      </a>
      <a href="/admin/payments.html" class="admin-nav__link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2" ry="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
        Pembayaran
      </a>
      <a href="/admin/profile.html" class="admin-nav__link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        Profil Admin
      </a>
      
      <a href="#" id="logout-btn" class="admin-nav__link" style="margin-top: auto; color: #EF4444;">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        Logout
      </a>
    </nav>
    
    <div class="admin-sidebar__footer">
      <div class="theme-toggle">
        <button class="active">Light</button>
        <button>Dark</button>
      </div>
    </div>
  </aside>

  <main class="admin-main">
    <header class="admin-header">
      <div class="admin-header__left">
        <button class="admin-menu-toggle" id="admin-menu-toggle">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <div class="admin-header__greeting">
          <strong>Content & Promo</strong>
        </div>
      </div>
      
      <div class="admin-header__right">
        <div class="admin-search hide-mobile">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" placeholder="Search settings..." />
        </div>
        <img src="https://ui-avatars.com/api/?name=Admin&background=E5E7EB&color=374151" alt="Avatar" class="admin-avatar" id="header-avatar" />
      </div>
    </header>

    <div class="admin-content">
      <div id="toast" style="display:none; background: var(--color-success); color: white; padding: var(--space-3); border-radius: var(--radius-sm); margin-bottom: var(--space-4);">Berhasil disimpan!</div>
      
      <form id="content-form">
        <!-- Pengaturan Hero & Landing Page -->
        <div class="admin-card" style="margin-bottom: 24px;">
          <div class="admin-card-header">
            <div class="admin-card-title">Teks Landing Page</div>
          </div>
          <div class="form-group mb-4">
            <label class="form-label">Teks Promosi Berjalan (Announcement Bar)</label>
            <input type="text" class="input w-full" id="announcement" style="background: #F9FAFB; border-radius: 8px;" />
          </div>
          <div class="form-group mb-4">
            <label class="form-label">Teks Kecil Hero (Tagline)</label>
            <input type="text" class="input w-full" id="hero_tagline" style="background: #F9FAFB; border-radius: 8px;" />
          </div>
          <div class="form-group mb-4">
            <label class="form-label">Teks Utama Hero (Title)</label>
            <textarea class="input w-full" id="hero_title" rows="2" style="background: #F9FAFB; border-radius: 8px;"></textarea>
          </div>
        </div>

        <!-- Gambar -->
        <div class="admin-card" style="margin-bottom: 24px;">
          <div class="admin-card-header">
            <div class="admin-card-title">Logo & Banner Utama</div>
          </div>
          <div class="admin-grid-2">
            <div>
              <div class="form-group mb-4">
                <label class="form-label">Upload Logo Baru</label>
                <input type="file" class="input w-full" id="logo_upload" accept="image/*" style="background: #F9FAFB; border-radius: 8px; padding: 8px;" />
                <input type="hidden" id="logo_url" />
                <div class="mt-2"><img id="logo_preview" style="max-height: 50px; background: #ccc; padding: 4px; border-radius: 4px;" /></div>
              </div>
            </div>
            <div>
              <div class="form-group mb-4">
                <label class="form-label">Upload Banner Utama Baru</label>
                <input type="file" class="input w-full" id="banner_upload" accept="image/*" style="background: #F9FAFB; border-radius: 8px; padding: 8px;" />
                <input type="hidden" id="banner_url" />
                <div class="mt-2"><img id="banner_preview" style="max-height: 100px; border-radius: 8px;" /></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Flash Sale -->
        <div class="admin-card" style="margin-bottom: 24px;">
          <div class="admin-card-header">
            <div class="admin-card-title">Pengaturan Flash Sale</div>
          </div>
          <div class="form-group mb-4" style="display: flex; align-items: center; gap: 8px;">
            <input type="checkbox" id="fs_active" style="width: 20px; height: 20px; accent-color: #3B82F6;" />
            <label class="form-label" style="margin: 0;">Aktifkan Flash Sale</label>
          </div>
          <div class="form-group mb-4">
            <label class="form-label">Judul Flash Sale</label>
            <input type="text" class="input w-full" id="fs_title" style="background: #F9FAFB; border-radius: 8px;" />
          </div>
          <div class="form-group mb-4">
            <label class="form-label">Batas Waktu Flash Sale (Berakhir pada)</label>
            <input type="datetime-local" class="input" id="fs_end" style="background: #F9FAFB; border-radius: 8px;" />
          </div>
        </div>

        <button type="submit" class="btn btn--primary" id="save-btn">Simpan Perubahan</button>
      </form>
    </div>
  </main>

  <script type="module" src="../js/admin/content.js"></script>
</body>
</html>
