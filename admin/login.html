<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>REDLINE Admin - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0a1628 0%, #0f2044 25%, #1a3a6e 50%, #132d5a 75%, #0a1628 100%);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      position: relative;
      overflow: hidden;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    /* Ambient glow effects */
    body::before {
      content: '';
      position: fixed;
      top: -30%;
      left: -20%;
      width: 60%;
      height: 60%;
      background: radial-gradient(circle, rgba(30, 80, 180, 0.15) 0%, transparent 70%);
      pointer-events: none;
      animation: float1 20s ease-in-out infinite;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -30%;
      right: -20%;
      width: 70%;
      height: 70%;
      background: radial-gradient(circle, rgba(20, 60, 160, 0.12) 0%, transparent 70%);
      pointer-events: none;
      animation: float2 25s ease-in-out infinite;
    }

    @keyframes float1 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(40px, 30px); }
    }
    @keyframes float2 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-30px, -40px); }
    }

    /* Login card */
    .login-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 3rem 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.3),
        0 0 100px rgba(30, 80, 200, 0.08);
      position: relative;
      z-index: 10;
      animation: cardEnter 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(20px);
    }

    @keyframes cardEnter {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Header */
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: linear-gradient(135deg, #1a3a8a 0%, #2553c7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
      box-shadow: 0 4px 15px rgba(30, 70, 170, 0.35);
    }

    .login-icon svg {
      width: 28px;
      height: 28px;
      color: #ffffff;
    }

    .login-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 0.35rem;
    }

    .login-subtitle {
      font-size: 0.9rem;
      color: #6B7280;
      font-weight: 400;
    }

    /* Form groups */
    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #1F2937;
      margin-bottom: 0.5rem;
    }

    .input-wrapper {
      position: relative;
    }

    .form-input {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
      color: #1F2937;
      background: #ffffff;
      border: 1.5px solid #D1D5DB;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-input::placeholder {
      color: #9CA3AF;
    }

    .form-input:focus {
      border-color: #3B82F6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
    }

    /* Password toggle */
    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #9CA3AF;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
      border-radius: 6px;
    }

    .password-toggle:hover {
      color: #6B7280;
    }

    .password-toggle svg {
      width: 20px;
      height: 20px;
    }

    /* Remember me & Forgot password row */
    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      user-select: none;
    }

    .remember-me input[type="checkbox"] {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 1.5px solid #D1D5DB;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      background: #fff;
    }

    .remember-me input[type="checkbox"]:checked {
      background: #2563EB;
      border-color: #2563EB;
    }

    .remember-me input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 4.5px;
      top: 1.5px;
      width: 5px;
      height: 9px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .remember-me span {
      font-size: 0.85rem;
      color: #4B5563;
    }

    .forgot-link {
      font-size: 0.85rem;
      color: #2563EB;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    .forgot-link:hover {
      color: #1D4ED8;
      text-decoration: underline;
    }

    /* Error message */
    .error-message {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      display: none;
      animation: errorShake 0.4s ease;
    }

    .error-message p {
      color: #DC2626;
      font-size: 0.85rem;
      font-weight: 500;
      margin: 0;
    }

    @keyframes errorShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    /* Submit button */
    .login-btn {
      width: 100%;
      padding: 0.875rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      color: #ffffff;
      background: linear-gradient(135deg, #1a3a8a 0%, #2563EB 50%, #1a3a8a 100%);
      background-size: 200% 200%;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      letter-spacing: 0.02em;
    }

    .login-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent, rgba(255,255,255,0.1), transparent);
      transform: translateX(-100%);
      transition: transform 0.5s ease;
    }

    .login-btn:hover {
      background-position: 100% 50%;
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4);
      transform: translateY(-1px);
    }

    .login-btn:hover::before {
      transform: translateX(100%);
    }

    .login-btn:active {
      transform: translateY(0);
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
    }

    .login-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    /* Spinner */
    .btn-spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Footer */
    .login-footer {
      text-align: center;
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid #F3F4F6;
    }

    .login-footer p {
      font-size: 0.8rem;
      color: #9CA3AF;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .login-card {
        margin: 1rem;
        padding: 2rem 1.5rem 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="login-card">
    <!-- Header -->
    <div class="login-header">
      <div class="login-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z" />
        </svg>
      </div>
      <h1 class="login-title">Admin Login</h1>
      <p class="login-subtitle">Masuk ke panel administrator</p>
    </div>

    <!-- Login form -->
    <form id="admin-login-form" autocomplete="on">
      <div class="form-group">
        <label for="email" class="form-label">Email</label>
        <div class="input-wrapper">
          <input
            type="email"
            id="email"
            class="form-input"
            required
            autocomplete="email"
            placeholder="admin@example.com"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <div class="input-wrapper">
          <input
            type="password"
            id="password"
            class="form-input"
            required
            autocomplete="current-password"
            placeholder="Masukkan password"
          />
          <button type="button" class="password-toggle" id="toggle-password" aria-label="Toggle password visibility">
            <!-- Eye icon (shown when password is hidden) -->
            <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>
            <!-- Eye-off icon (shown when password is visible) -->
            <svg id="eye-off-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="display:none;">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
          </button>
        </div>
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" id="remember-me" />
          <span>Ingat saya</span>
        </label>
        <a href="#" class="forgot-link">Lupa password?</a>
      </div>

      <!-- Error message -->
      <div class="error-message" id="login-error">
        <p id="error-text">Email dan password wajib diisi.</p>
      </div>

      <button type="submit" class="login-btn" id="login-btn">
        Masuk
      </button>
    </form>

    <!-- Footer -->
    <div class="login-footer">
      <p>&copy; 2024 AdminPanel &middot; Hak cipta dilindungi</p>
    </div>
  </div>

  <script type="module">
    // Password visibility toggle
    const toggleBtn = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eye-icon');
    const eyeOffIcon = document.getElementById('eye-off-icon');

    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      eyeIcon.style.display = isPassword ? 'none' : 'block';
      eyeOffIcon.style.display = isPassword ? 'block' : 'none';
    });

    // Form submission
    const form = document.getElementById('admin-login-form');
    const loginBtn = document.getElementById('login-btn');
    const errorDiv = document.getElementById('login-error');
    const errorText = document.getElementById('error-text');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      // Client-side validation
      if (!email || !password) {
        showError('Email dan password wajib diisi.');
        return;
      }

      // Disable button + show spinner
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<span class="btn-spinner"></span> Memproses...';
      hideError();

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok && data.user.role === 'admin') {
          localStorage.setItem('adminToken', data.token);
          loginBtn.innerHTML = '✓ Berhasil';
          loginBtn.style.background = '#059669';
          setTimeout(() => {
            window.location.href = '/admin/index.html';
          }, 500);
        } else {
          showError(data.error || 'Akses ditolak. Pastikan akun Anda memiliki hak admin.');
          resetButton();
        }
      } catch (err) {
        showError('Gagal terhubung ke server. Coba lagi nanti.');
        resetButton();
      }
    });

    function showError(msg) {
      errorText.textContent = msg;
      errorDiv.style.display = 'block';
    }

    function hideError() {
      errorDiv.style.display = 'none';
    }

    function resetButton() {
      loginBtn.disabled = false;
      loginBtn.innerHTML = 'Masuk';
    }
  </script>
</body>
</html>
