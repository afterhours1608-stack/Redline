<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REDLINE Admin - Login</title>
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/typography.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      background-color: #000;
      font-family: var(--font-sans);
    }
    .login-container {
      display: flex;
      width: 100%;
      height: 100%;
    }
    .login-image {
      flex: 1;
      background-image: url('../images/redline_hero_3.jpg');
      background-size: cover;
      background-position: center;
      position: relative;
      display: none;
    }
    .login-image::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, rgba(0,0,0,0.2), rgba(0,0,0,0.8));
    }
    .login-form-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      position: relative;
      padding: 2rem;
    }
    .login-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 3rem 2rem;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 100%;
      max-width: 400px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .login-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .login-logo {
      font-family: var(--font-display);
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: 4px;
      color: #fff;
      margin: 0;
      line-height: 1;
    }
    .login-logo span {
      color: #EF4444; /* var(--color-danger) */
    }
    .login-subtitle {
      color: #9CA3AF;
      font-size: 0.9rem;
      margin-top: 0.5rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    .form-label {
      color: #D1D5DB;
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
      display: block;
    }
    .login-input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      transition: all 0.2s;
    }
    .login-input:focus {
      outline: none;
      border-color: #EF4444;
      background: rgba(0, 0, 0, 0.4);
    }
    .login-btn {
      width: 100%;
      padding: 0.875rem;
      background: #EF4444;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .login-btn:hover {
      background: #DC2626;
    }
    #login-error {
      color: #FCA5A5;
      text-align: center;
      margin-top: 1rem;
      font-size: 0.9rem;
      min-height: 20px;
    }

    @media (min-width: 768px) {
      .login-image {
        display: block;
      }
      .login-form-wrapper {
        max-width: 500px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-image"></div>
    <div class="login-form-wrapper">
      <div class="login-card">
        <div class="login-header">
          <h1 class="login-logo"><span>RED</span>LINE</h1>
          <div class="login-subtitle">Admin Portal</div>
        </div>
        <form id="admin-login-form">
          <div class="form-group">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" id="email" class="login-input" required autocomplete="email" placeholder="admin@redline.com" />
          </div>
          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" class="login-input" required autocomplete="current-password" placeholder="••••••••" />
          </div>
          <button type="submit" class="login-btn">Secure Login</button>
          <div id="login-error" style="display:none;"></div>
        </form>
      </div>
    </div>
  </div>
  <script type="module" src="../js/admin/login.js"></script>
</body>
</html>
