<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REDLINE Admin - Login</title>
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/typography.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <style>
    body { background-color: var(--color-surface); display: flex; align-items: center; justify-content: center; height: 100vh; }
    .login-card { background: white; padding: var(--space-8); border-radius: var(--radius-md); box-shadow: var(--shadow-md); width: 100%; max-width: 400px; }
    .login-card h1 { font-family: var(--font-display); font-size: 2rem; margin-bottom: var(--space-6); text-align: center; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>REDLINE ADMIN</h1>
    <form id="admin-login-form">
      <div class="form-group mb-4">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" class="input w-full" required />
      </div>
      <div class="form-group mb-6">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="input w-full" required />
      </div>
      <button type="submit" class="btn btn--primary w-full">Login</button>
      <div id="login-error" class="text-center mt-4" style="color: var(--color-danger); display:none;"></div>
    </form>
  </div>
  <script type="module" src="../js/admin/login.js"></script>
</body>
</html>
